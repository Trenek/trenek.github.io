[display]
show_time = true
time_format = "%a %b %d %H:%M:%S"
greeting = "Ahoj Kamracie!"
battery = true

[sessions]
sessions_dirs = ["/usr/share/wayland-sessions"]
xsessions_dirs = ["/usr/share/xsessions"]

[remember]
# username = true
session = true
# user_session = true

[background]
kind = "doom"
fps = 30

[user_menu]
enabled = true

[secret]
mode = "characters"
characters = "*"

[theme]
border = "white"
text = "green"
time = "bright-green"
container = "black"
title = "cyan"
greet = "yellow"
prompt = "magenta"
input = "white"
action = "orange"
button = "bright-red"
